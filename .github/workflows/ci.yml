name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write # lets the lockfile step push to PR branches
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref }}

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # PRs may change dependencies: refresh the lockfile and commit it back.
      # main always installs exactly what the lockfile says.
      - name: Install
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            scripts/ci.sh pnpm install --no-frozen-lockfile
          else
            scripts/ci.sh pnpm install --frozen-lockfile
          fi

      - name: Commit updated lockfile
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if ! git diff --quiet pnpm-lock.yaml pnpm-workspace.yaml; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: update pnpm lockfile" pnpm-lock.yaml pnpm-workspace.yaml
            git push
          fi

      - run: scripts/ci.sh pnpm lint
      - run: scripts/ci.sh pnpm typecheck
      - run: scripts/ci.sh pnpm test
      - run: scripts/ci.sh pnpm build:worker # next build + Cloudflare worker
      - run: scripts/ci.sh pnpm bundle:check
      - run: TAIL=150 scripts/ci.sh scripts/worker-debug.sh # TEMP debug
        continue-on-error: true

      - run: scripts/ci.sh pnpm exec playwright install --with-deps chromium
      - run: scripts/ci.sh pnpm test:e2e # runs on the real Cloudflare runtime
        env:
          TAIL: 150
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Cloudflare secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in Settings → Secrets and variables → Actions."
            exit 1
          fi

      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: scripts/ci.sh pnpm install --frozen-lockfile
      - name: Deploy
        id: deploy
        run: |
          scripts/ci.sh pnpm run deploy | tee deploy.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "::notice title=Live::$url"

      - name: Smoke test live site
        env:
          BASE_URL: ${{ steps.deploy.outputs.url }}
        run: |
          scripts/ci.sh pnpm exec playwright install --with-deps chromium
          scripts/ci.sh pnpm test:e2e

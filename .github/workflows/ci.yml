name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # PRs may change dependencies: refresh the lockfile and commit it back.
  # Runs no package code (--ignore-scripts): the write token never sits next to untrusted code.
  lockfile:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: scripts/ci.sh pnpm install --lockfile-only --ignore-scripts
      - name: Commit updated lockfile
        run: |
          if ! git diff --quiet pnpm-lock.yaml pnpm-workspace.yaml; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: update pnpm lockfile" pnpm-lock.yaml pnpm-workspace.yaml
            git push
          fi

  # Builds and tests with a read-only token, no stored credentials, exactly the lockfile.
  test:
    needs: lockfile
    if: ${{ !cancelled() && needs.lockfile.result != 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.sha }} # PRs: includes the lockfile update
          persist-credentials: false

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: scripts/ci.sh pnpm install --frozen-lockfile

      - run: scripts/ci.sh pnpm lint
      - run: NOTICE=1 TAIL=120 scripts/ci.sh pnpm run lint:react # React audit: correctness, performance, security, a11y
      - run: scripts/ci.sh pnpm typecheck
      - run: scripts/ci.sh pnpm test
      - run: scripts/ci.sh pnpm test:blog
      - run: scripts/ci.sh pnpm build:worker # next build + Cloudflare worker
      - run: scripts/ci.sh pnpm bundle:check
      - run: scripts/ci.sh pnpm exec wrangler deploy --dry-run -c workers/budget-guard/wrangler.jsonc --outdir .guard-build # the guard bundles

      - run: scripts/ci.sh pnpm exec playwright install --with-deps chromium
      - run: scripts/ci.sh pnpm test:e2e # runs on the real Cloudflare runtime
        env:
          TAIL: 150
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  deploy:
    needs: test
    # !cancelled(): on push the lockfile job is skipped, and a skipped job up the chain skips this one by default.
    if: ${{ !cancelled() && needs.test.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      # Install and build never see the Cloudflare secrets.
      - run: scripts/ci.sh pnpm install --frozen-lockfile
      - run: scripts/ci.sh pnpm build:worker

      - name: Deploy
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Optional: copied to the Worker when set (see scripts/cf-resources.mjs)
          ZEPTOMAIL_TOKEN: ${{ secrets.ZEPTOMAIL_TOKEN }} # ZeptoMail agent → Send Mail Token
          AUTH_GOOGLE_ID: ${{ secrets.AUTH_GOOGLE_ID }}
          AUTH_GOOGLE_SECRET: ${{ secrets.AUTH_GOOGLE_SECRET }}
          AUTH_GITHUB_ID: ${{ secrets.AUTH_GITHUB_ID }}
          AUTH_GITHUB_SECRET: ${{ secrets.AUTH_GITHUB_SECRET }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          BUDGET_GUARD_API_TOKEN: ${{ secrets.BUDGET_GUARD_API_TOKEN }} # permissions: README "Kill switch"
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in Settings → Secrets and variables → Actions."
            exit 1
          fi
          scripts/ci.sh node scripts/cf-resources.mjs # D1 database + migrations
          scripts/ci.sh pnpm exec opennextjs-cloudflare deploy
          # No workers.dev: everything goes through dotstories.com (firewall, cache, kill switch).
          echo "url=https://dotstories.com" >> "$GITHUB_OUTPUT"
          # Budget guard first (bill protection): hourly cron, pulls the kill switch over the budget (README: "Kill switch")
          scripts/ci.sh pnpm exec wrangler deploy -c workers/budget-guard/wrangler.jsonc
          if [ -n "$BUDGET_GUARD_API_TOKEN" ]; then
            printf '%s' "$BUDGET_GUARD_API_TOKEN" | pnpm exec wrangler secret put CF_API_TOKEN -c workers/budget-guard/wrangler.jsonc >/dev/null
          else
            echo "::warning title=Budget guard::Add the BUDGET_GUARD_API_TOKEN secret, or the guard can't read your usage (README: Kill switch)."
          fi
          # blog.dotstories.com: static, its own Worker, custom domain attached by wrangler
          scripts/ci.sh pnpm blog:build
          scripts/ci.sh pnpm exec wrangler deploy -c blog/wrangler.jsonc

      - name: Smoke test live site
        env:
          BASE_URL: ${{ steps.deploy.outputs.url }}
        run: |
          scripts/ci.sh pnpm exec playwright install --with-deps chromium
          scripts/ci.sh pnpm test:e2e

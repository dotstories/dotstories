name: Engine

on:
  pull_request:
    paths: ["runner/engine/**", ".github/workflows/engine.yml"]
  push:
    branches: [main]
    paths: ["runner/engine/**", ".github/workflows/engine.yml"]

concurrency:
  group: engine-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: runner/engine

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # lets the lockfile step push to PR branches
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref }}
      - uses: astral-sh/setup-uv@v7

      # Tests never install the heavy ML extra (torch, diffusers).
      - name: Test
        shell: bash
        run: ../../scripts/ci.sh uv run pytest -v

      - name: Commit updated uv.lock
        if: matrix.os == 'ubuntu-latest' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          if [ -n "$(git status --porcelain uv.lock)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add uv.lock
            git commit -m "chore: update engine uv.lock"
            git pull --rebase
            git push
          fi

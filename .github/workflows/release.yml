name: Release runner app

# Push a tag like runner-v0.1.0 → builds the installers → public GitHub Release.
# Stable download links for the website:
#   https://github.com/dotstories/dotstories/releases/latest/download/DotStories-Windows.exe
#   https://github.com/dotstories/dotstories/releases/latest/download/DotStories-Mac.dmg
on:
  push:
    tags: ["runner-v*"]

jobs:
  build:
    uses: ./.github/workflows/runner-app.yml

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
      - name: Stable file names
        # upload-artifact keeps the bundle folders (nsis/, dmg/), so search inside each artifact.
        # Exactly one installer per platform, or stop: never publish the wrong file.
        run: |
          find artifacts -type f | sort
          one() {
            mapfile -t found < <(find "$1" -type f -name "$2")
            if [ "${#found[@]}" -ne 1 ]; then echo "::error::Expected 1 $2 in $1, found ${#found[@]}"; exit 1; fi
            cp "${found[0]}" "$3"
          }
          mkdir out
          one artifacts/DotStories-x86_64-pc-windows-msvc '*.exe' out/DotStories-Windows.exe
          one artifacts/DotStories-aarch64-apple-darwin '*.dmg' out/DotStories-Mac.dmg
          ls -la out
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "DotStories app ${GITHUB_REF_NAME#runner-v}" \
            --notes "Install once, then press Run on dotstories.com. First start downloads Python and the AI libraries (a few GB). Unsigned build: Windows may show SmartScreen (More info → Run anyway); on Mac right-click → Open."

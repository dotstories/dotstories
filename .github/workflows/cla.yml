name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, closed]

permissions:
  actions: write
  contents: read # signatures live in the central dotstories/cla repo
  pull-requests: write
  statuses: write

jobs:
  cla-assistant:
    runs-on: ubuntu-latest
    steps:
      # Only the PR author signs: every other committer is allowlisted.
      - name: Build author-only allowlist
        id: allowlist
        if: >
          (github.event_name == 'pull_request_target' && github.event.action != 'closed') ||
          (github.event_name == 'issue_comment' && github.event.issue.pull_request && (
            github.event.comment.body == 'recheck' ||
            github.event.comment.body == 'I have read and agree to the Contributor License Agreement'
          ))
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login || github.event.issue.user.login }}
          BASE_ALLOWLIST: Dayonel,claude,GitHub Action,github-actions,github-actions[bot],dependabot[bot],*[bot]
        run: |
          if ! commit_authors=$(gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}/commits" --paginate \
            --jq '.[] | (.author.login // .commit.author.name // empty), (.committer.login // .commit.committer.name // empty)'); then
            echo "Failed to fetch pull request commits" >&2
            exit 1
          fi
          others=$(printf '%s\n' "$commit_authors" | sort -u | grep -vix "${PR_AUTHOR}" | paste -sd, -)
          if [ -n "$others" ]; then
            echo "allowlist=${BASE_ALLOWLIST},${others}" >> "$GITHUB_OUTPUT"
          else
            echo "allowlist=${BASE_ALLOWLIST}" >> "$GITHUB_OUTPUT"
          fi

      - name: CLA Assistant
        # The phrase must match custom-pr-sign-comment below.
        if: >
          (github.event_name == 'pull_request_target' && github.event.action != 'closed') ||
          (github.event_name == 'issue_comment' && github.event.issue.pull_request && (
            github.event.comment.body == 'recheck' ||
            github.event.comment.body == 'I have read and agree to the Contributor License Agreement'
          ))
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Token that can write to dotstories/cla, where signatures are stored.
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        with:
          lock-pullrequest-aftermerge: false
          path-to-document: https://github.com/dotstories/cla/blob/main/dotstories_icla.md
          remote-organization-name: dotstories
          remote-repository-name: cla
          path-to-signatures: signatures/cla.json
          branch: main
          allowlist: ${{ steps.allowlist.outputs.allowlist }}
          custom-notsigned-prcomment: |
            Thank you for your contribution! 🎉

            Before we can merge it, please sign our [Contributor License Agreement](https://github.com/dotstories/cla/blob/main/dotstories_icla.md). You sign once, and it covers all your future pull requests. By signing, you:

            - Confirm that the contribution is yours to give.
            - Keep the copyright and the right to reuse your own work.
            - Give DotStories a license to include and share it.

            In return, the CLA promises that your contribution always stays open source. It is based on the Apache Software Foundation's CLA.

            **To sign, post a new comment on this PR with exactly this text:**
          custom-pr-sign-comment: I have read and agree to the Contributor License Agreement
          custom-allsigned-prcomment: |
            ✅ All contributors have signed the CLA. Thank you!

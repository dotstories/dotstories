[package]
name = "dotstories-runner"
version = "0.2.0"
description = "Runs DotStories dots on your own computer"
edition = "2021"
license = "AGPL-3.0-only"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
opt-level = "s"
